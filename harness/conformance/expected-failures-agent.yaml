# Known failures of ncp in the official conformance suite when the adapter
# acts as an agent: no TTY and an empty stdin. Each entry has its reason.
# The suite fails when an entry passes, so that this list stays current.
# The reports are docs/research/conformance*.md.
client:
  # A Client ID Metadata Document needs a stable HTTPS URL. Its place is a
  # release decision of the user, so CIMD is off.
  - auth/basic-cimd:cimd-client-id-used
  # The configuration reads only oauth.clientId (design C4). A client
  # secret in the configuration file would be a secret in a plain file.
  - auth/pre-registration:pre-registration-auth
  # With no TTY, ncp declares no elicitation and does not ask. An
  # input_required result gives exit 5, so that an agent never waits on a
  # question (design B63).
  - elicitation-sep1034-client-defaults
  - sep-2322-client-request-state
