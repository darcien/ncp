# git-cliff writes each new section of CHANGELOG.md from the feat, fix
# and breaking commits. The hook in release.toml runs it.
[changelog]
header = """
# Changelog

All notable changes to `ncp` are in this file. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and `ncp` uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# A breaking commit gives the steps for the user in its BREAKING CHANGE
# footer. The section shows them under the commit.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags }}

{% for commit in commits %}\
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking and commit.breaking_description != commit.message %}
  - {{ commit.breaking_description | replace(from="\n", to=" ") }}{% endif %}
{% endfor %}\
{% endfor %}\
"""
# The templates write all blank lines, so that one blank line stays
# between a new section and the old ones.
trim = false

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
# The number in each group name sets the order of the groups.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Changed" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = ".*", skip = true },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

# The template uses no data from GitHub, so git-cliff needs no network.
[remote]
offline = true

# At 0.y, as in uv, a breaking commit gives the next minor version, and a
# feat or fix commit gives the next patch version.
[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
