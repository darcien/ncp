[package]
name = "ncp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The credential store trait of rmcp is an async-trait trait.
async-trait = "0.1"
# Encodes the values for the security program on macOS. reqwest already
# depends on it.
base64 = "0.23"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# The shell completion scripts.
clap_complete = "4.6"
futures-util = { version = "0.3", default-features = false }
http = "1"
# The proxy matcher of reqwest, so that -v and the errors show the route
# that reqwest takes.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# The CPU time for --timings. process-wrap already depends on it.
nix = { version = "0.31", default-features = false, features = ["fs", "resource", "user"] }
jsonschema = { version = "0.58.6", default-features = false }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
# system-proxy: the proxy of the macOS system settings, as uv.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["auth", "client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The event type of the Streamable HTTP client trait of rmcp.
sse-stream = "0.2"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process", "io-util", "io-std", "net", "signal"] }
tokio-util = "0.7"
# The connector layer of reqwest, to time each new connection.
tower-layer = "0.3"
tower-service = "0.3"
url = "2.5.8"
# JSONC: comments and trailing commas in the configuration files, as VS Code
# and Zed read them. The cst feature edits a file and keeps its other bytes.
jsonc-parser = { version = "=0.33.2", default-features = false, features = ["cst", "serde"] }

# The hash of a trusted project file. oauth2 of rmcp already depends on it.
sha2 = "0.10"

# Pure Rust, so the static musl build needs no libdbus. zbus with async-io
# blocks with async_io::block_on and not with a tokio runtime, so a call from
# a tokio thread does not panic. The call still blocks: run it on a blocking
# thread. deny.toml refuses the zbus tokio feature.
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "=1.0.0"
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
# The same version as the store uses. A direct search gives the locked and
# the unlocked items apart, so that a list of names needs no unlock.
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[lints]
workspace = true
