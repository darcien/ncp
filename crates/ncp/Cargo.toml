[package]
name = "ncp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
jsonschema = { version = "0.58.6", default-features = false }
keyring-core = "=1.0.0"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "kill-on-drop"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process", "io-util", "io-std", "net", "signal"] }
tokio-util = "0.7"
url = "2.5.8"

# The legacy keychain API. The Data Protection keychain needs a provisioning
# profile, which a command-line tool does not have.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

# Pure Rust, so the static musl build needs no libdbus. zbus with async-io
# blocks with async_io::block_on and not with a tokio runtime, so a call from
# a tokio thread does not panic. The call still blocks: run it on a blocking
# thread. deny.toml refuses the zbus tokio feature.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[lints]
workspace = true
