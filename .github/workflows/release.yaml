# Builds, attests and publishes a release when the user pushes a release
# tag. docs/release.md gives the steps.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# A second run for the same tag waits, so that it does not cancel the job
# publish of the first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TAG: ${{ github.ref_name }}
        run: harness/release.sh check "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: dist/notes.md
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: harness/release.sh macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-macos
          path: dist/ncp-*-apple-darwin
          if-no-files-found: error

  # Each Linux binary builds on a runner of its own architecture, because
  # the musl-gcc of the harness makes code only for that architecture.
  linux:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          NCP_LINUX_PLATFORM: ${{ matrix.platform }}
        run: harness/release.sh linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.runner }}
          path: dist/ncp-*-unknown-linux-musl
          if-no-files-found: error

  # The step pack runs in the arm64 harness image. It sets the file modes,
  # because the workflow artifacts do not keep them.
  pack:
    needs: [macos, linux]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: harness/release.sh pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: |
            dist/ncp-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  attest:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # gh makes a draft, uploads the archives and SHA256SUMS, and then
  # publishes the draft. With immutable releases, the tag and these files
  # cannot change after that.
  publish:
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "ncp ${TAG#v}" --notes-file dist/notes.md
          dist/ncp-*.tar.gz dist/SHA256SUMS
