# Checks the advisories of the locked crates each day. The RustSec database
# changes when the repository does not, and the check of each push only warns.
name: advisories

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      MISE_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny runs cargo metadata, so the job needs the Rust toolchain.
      - run: rustup toolchain install
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: cargo-deny
          cache: false
      - run: .github/scripts/advisory-issues.sh
        env:
          GH_TOKEN: ${{ github.token }}
