name: conformance

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - mise.toml
      - mise.lock
      - harness/conformance/**
      - .github/workflows/conformance.yaml
  workflow_dispatch:

permissions: {}

jobs:
  # The suite is third-party npm code. This job has only read access. The
  # Pages workflow deploys the result, so the suite cannot get a token that
  # publishes the site.
  conformance:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # This job can read but not write the Actions cache, so the suite cannot
    # change the Rust cache of the job check in ci.yaml.
    cache-mode: read
    env:
      # The suite needs only Node from mise. mise run does not install the
      # other tools of mise.toml, because mise builds some of them from source.
      MISE_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The job check in ci.yaml saves this cache. The key of this step must be
      # the same as in check: the same shared key, toolchain steps and Rust and
      # Cargo variables. The tests of check turn on more features of some
      # dependencies, so these dependencies build again here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ hashFiles('Cargo.toml') }}
          save-if: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: node
          cache: false
      - run: mise run conformance:install
      - run: mise run conformance
      # The Pages workflow refuses a report of more than 10 MiB.
      - id: report
        if: ${{ !cancelled() }}
        run: |
          file=harness/conformance/results/conformance.json
          if [ -f "$file" ] && [ "$(wc -c < "$file")" -le 10485760 ]; then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !cancelled() && steps.report.outputs.upload == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance
          path: harness/conformance/results/conformance.json
          if-no-files-found: ignore
