name: ci

# A document change can break the test that reads STYLE.md, so no path
# filter limits these checks.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions: {}

jobs:
  # CI tests Linux glibc on x86_64. The git hook tests macOS on the host
  # and Linux musl in a container.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # mise run does not install the other tools of mise.toml, because
      # mise builds some of them from source.
      MISE_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The cache keeps the compiled dependencies and the Cargo downloads, but
      # not the workspace crates. Its key contains the version of each installed
      # Rust toolchain, so install the toolchain first. The action does not hash
      # the root Cargo.toml, which holds the profiles, so this step adds its
      # hash to the shared key. Only main saves the cache. Other branches and
      # the job conformance in conformance.yaml use the cache of main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # mise.lock pins a release archive of each of these tools.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8
          install_args: node cargo-deny typos shellcheck hk
          cache: false
      - run: mise run check
      - run: mise run test
