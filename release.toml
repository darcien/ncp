# cargo-release sets the version of the workspace, commits, tags and
# pushes. The workspace in Cargo.toml has one version and does not publish
# to crates.io.
allow-branch = ["main"]
tag-name = "v{{version}}"
tag-message = "ncp {{version}}"
pre-release-commit-message = "chore(release): {{version}}"
# git-cliff adds the section of the new version to CHANGELOG.md, and the
# release commit includes it. cargo-release also runs the hook in a dry
# run, so in a dry run the hook only shows the section. The release commit
# deletes RELEASE_NOTE.md, because cargo-release commits with `git commit -a`.
pre-release-hook = ["sh", "-c", """
cd "$WORKSPACE_ROOT"
set -- --unreleased --tag "v$NEW_VERSION"
if [ -f RELEASE_NOTE.md ]; then
	set -- "$@" --with-tag-message "$(cat RELEASE_NOTE.md)"
fi
if [ "$DRY_RUN" = true ]; then
	git-cliff "$@"
else
	git-cliff "$@" --prepend CHANGELOG.md
	rm -f RELEASE_NOTE.md
fi
"""]
