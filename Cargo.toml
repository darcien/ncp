[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Debug info is the largest part of the build output. Line tables keep the
# file and line in backtraces of the workspace crates. The dependencies get
# no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A release is one static binary. Link-time optimization over all crates
# and one code unit give a smaller and faster binary; the build is slower.
# The symbols go away, because a release ships no debug info.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
