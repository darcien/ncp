# Rust itself is pinned in rust-toolchain.toml (rustup). mise pins the other tools.
[tools]
# The official MCP conformance suite runs on Node (harness/conformance).
node = "22.23.3"
cargo-deny = "0.20.2"
typos = "1.50.3"
hk = "2.5.0"
shellcheck = "0.11.0"
# pnpm installs the interop server (harness/interop). No Corepack.
pnpm = "12.10.1"

# `hk install` then runs the hooks through `mise x`, so that the hooks use
# the pinned tools.
[env]
HK_MISE = "1"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."check:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Lint with clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:deny"]
description = "Check dependency licenses, advisories, bans and sources"
run = "cargo deny --locked check"

[tasks."check:typos"]
description = "Check spelling in code and docs"
run = "typos"

# With no files, it checks all shell scripts that git tracks.
[tasks."check:shellcheck"]
description = "Lint shell scripts"
usage = 'arg "[file]..." var=#true'
run = 'shellcheck ${usage_file:-$(git ls-files "*.sh")}'

# The build output and the container disk grow with no limit. Monitor them
# to prevent a full disk.
[tasks."check:disk"]
description = "Show the size of the build output and the container disk, and the free disk space"
run = """
[ ! -d target ] || du -sh target
data_dir="$(orb config show 2>/dev/null | sed -n 's/^data_dir: //p')"
[ -z "$data_dir" ] && exit 0
du -sh "$data_dir"
df -Ph "$data_dir" | awk 'NR == 2 { print $4 " free on " $6 }'
"""

[tasks.check]
description = "Run all static checks"
depends = ["check:fmt", "check:clippy", "check:deny", "check:typos", "check:shellcheck"]

[tasks.test]
description = "Run all tests. Tests use only local servers"
run = "cargo test --workspace --locked"

# The Linux tasks run in a container (harness/linux). NCP_LINUX_PLATFORM
# selects linux/arm64 (default) or linux/amd64.
[tasks."linux:image"]
description = "Build the Linux harness image for the musl target"
run = "harness/linux/run.sh image"

[tasks."linux:check"]
description = "Lint with clippy for the Linux musl target in a container"
depends = ["linux:image"]
run = "harness/linux/run.sh cargo clippy --workspace --all-targets --locked -- -D warnings"

# The tests run with no network. The fetch step before them is online.
[tasks."linux:test"]
description = "Run all tests for the Linux musl target in a container, with no network"
depends = ["linux:image"]
run = [
  "harness/linux/run.sh cargo fetch --locked",
  "harness/linux/run.sh offline cargo test --workspace --locked",
]

[tasks.release]
description = "Build the release binaries for macOS and Linux, run them, and write SHA256SUMS"
run = "harness/release.sh"

# The conformance suite: an online install from the lock file, then an
# offline run. See harness/conformance/run.sh.
[tasks."conformance:install"]
description = "Install the pinned MCP conformance suite from its lock file"
dir = "harness/conformance"
run = "npm ci --ignore-scripts"

[tasks.conformance]
description = "Run the official MCP conformance suite against ncp for each protocol version"
run = "harness/conformance/run.sh"

# The interop tests: an online install from the lock file, then an offline
# run against the official everything server. See docs/design/interop.md.
[tasks."interop:install"]
description = "Install the pinned MCP everything server from its lock file"
dir = "harness/interop"
run = "pnpm install --frozen-lockfile"

[tasks.interop]
description = "Run the interop tests against the official MCP everything server"
run = "cargo test -p ncp-testkit --locked --test interop -- --ignored"

# The live tests use the login Keychain, a browser, the system settings and
# a real server. Only the user runs them. See docs/live-tests.md.
[tasks.live]
description = "Run the live tests on this Mac. A person must be present"
run = "harness/live/run.sh"

# Run it before the other Linux tasks: a volume that is in use cannot be
# removed.
[tasks."linux:prune"]
description = "Show the size of the Linux target volumes, and remove each one above the limit"
run = "harness/linux/run.sh prune"

# The Secret Service tests start their own D-Bus session and keyring daemon
# in the container. They never run on the host.
[tasks."linux:secret-service"]
description = "Run the Secret Service tests in a container, with no network"
depends = ["linux:test"]
run = "harness/linux/run.sh secret-service"

[tasks.precommit]
description = "Format, then run all checks and tests on all files, on the host and in Linux"
run = "hk fix --all"
