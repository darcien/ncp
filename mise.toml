# Rust itself is pinned in rust-toolchain.toml (rustup). mise pins the other tools.
[tools]
cargo-deny = "0.20.2"
typos = "1.50.3"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."check:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."check:clippy"]
description = "Lint with clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."check:deny"]
description = "Check dependency licenses, advisories, bans and sources"
run = "cargo deny --locked check"

[tasks."check:typos"]
description = "Check spelling in code and docs"
run = "typos"

[tasks.check]
description = "Run all static checks"
depends = ["check:fmt", "check:clippy", "check:deny", "check:typos"]

[tasks.test]
description = "Run all tests. Tests use only local servers"
run = "cargo test --workspace --locked"

# The Linux tasks run in a container (harness/linux). NCP_LINUX_PLATFORM
# selects linux/arm64 (default) or linux/amd64.
[tasks."linux:image"]
description = "Build the Linux harness image for the musl target"
run = "harness/linux/run.sh image"

[tasks."linux:check"]
description = "Lint with clippy for the Linux musl target in a container"
depends = ["linux:image"]
run = "harness/linux/run.sh cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."linux:test"]
description = "Run all tests for the Linux musl target in a container"
depends = ["linux:image"]
run = "harness/linux/run.sh cargo test --workspace --locked"
